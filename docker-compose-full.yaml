services:
    agent:
        platform: linux/amd64
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        restart: always
        command: ["pnpm", "start", "--character='characters/trump.character.json'"]

    chat:
        tty: true
        stdin_open: true
        image: srajith/eliza-chat
        depends_on:
            - agent
        restart: always
        environment:
            - SERVER_URL=http://agent:3000
